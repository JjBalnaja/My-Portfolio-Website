<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Animation</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      font-family: Arial, sans-serif;
      color: white;
    }

    .container {
      text-align: center;
    }

    .container h1 {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .typing {
      font-size: 30px;
      color: #00e5ff;
      font-weight: bold;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 35px;
      background: red;
      margin-left: 5px;
      vertical-align: bottom;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      .container h1 {
        font-size: 32px;
      }

      .typing {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Welcome 👋</h1>

    <div>
      <span class="typing"></span>
      <span class="cursor"></span>
    </div>
  </div>

  <script>
    const texts = [
      "I'm a Web Developer",
      "I create beautiful websites",
      "I love coding 💻",
      "Welcome to my portfolio 🚀"
    ];

    const typingText = document.querySelector(".typing");

    let textIndex = 0;
    let charIndex = 0;
    let deleting = false;

    function typeEffect() {
      const currentText = texts[textIndex];

      if (!deleting) {
        // Add one character
        typingText.textContent =
          currentText.substring(0, charIndex + 1);

        charIndex++;

        // Finished typing
        if (charIndex === currentText.length) {
          deleting = true;

          // Pause before deleting
          setTimeout(typeEffect, 1800);
          return;
        }

        setTimeout(typeEffect, 100);
      } 
      else {
        // Remove one character
        typingText.textContent =
          currentText.substring(0, charIndex - 1);

        charIndex--;

        // Finished deleting
        if (charIndex === 0) {
          deleting = false;

          // Move to next sentence
          textIndex++;

          if (textIndex >= texts.length) {
            textIndex = 0;
          }

          setTimeout(typeEffect, 500);
          return;
        }

        setTimeout(typeEffect, 50);
      }
    }

    typeEffect();
  </script>

</body>
</html>
