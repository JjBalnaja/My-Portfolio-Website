<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* The container sets the boundaries */
        .card-container {
            position: relative;
            width: 300px;
            height: 200px;
            border: 2px solid #333;
            background-color: #f0f0f0;
        }

        /* The image pins itself exactly where you want it inside the container */
        .badge-image {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 50px;
            height: 50px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <h3>Product Card</h3>
        <p>This box is relative.</p>
        
        <!-- This image will float directly to the top-right corner of the box -->
        <img class="badge-image" src="images/badge.png" alt="Sale Badge">
    </div>

</body>
</html>
